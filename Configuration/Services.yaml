services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Tenryuubito\WizMonitorClient\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Error/ErrorOccurrence.php'
      - '../Classes/Log/Writer/MonitoringLogWriter.php'
      - '../Classes/Status/StatusRequest.php'

  cache.wiz_monitor_client_nonce:
    class: TYPO3\CMS\Core\Cache\Frontend\FrontendInterface
    factory: ['@TYPO3\CMS\Core\Cache\CacheManager', 'getCache']
    arguments: ['wiz_monitor_client_nonce']
